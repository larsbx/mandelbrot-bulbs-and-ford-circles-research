name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Estate audit (pinned public artifact)
        run: |
          set -eu
          rev=$(python3 -c 'import tomllib; print(next(d["rev"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          pin=$(python3 -c 'import tomllib; print(next(d["pin"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          test "$rev" = "f5fe90d588806c09998764c4929e6238f2298e64"
          curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/estate-audit.py "https://raw.githubusercontent.com/larsbx/finite-math-kernels/a08928d240cf2c7789fdd9bb3b6dc0c068eeef73/policy/estate-audits/$rev.py"
          printf '%s  %s\n' "${pin#sha256:}" /tmp/estate-audit.py | sha256sum --check --strict -
          python3 /tmp/estate-audit.py --root .
      - name: Audit the no-limits rule of the finite register
        run: python tools/audit_limits.py
      - name: Install dependencies
        run: python -m pip install numpy python-flint sympy pytest
      - name: Test
        run: python -m pytest -q tests/
