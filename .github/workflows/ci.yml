name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit estate repository architecture
        run: python tools/audit_estate_layout.py
      - name: Audit the no-limits rule of the finite register
        run: python tools/audit_limits.py
      - name: Install dependencies
        run: python -m pip install numpy python-flint sympy pytest
      - name: Test
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/
