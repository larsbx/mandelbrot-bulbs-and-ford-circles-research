version = 1
template = "estate-repository-v1"

[repository]
id = "larsbx/mandelbrot-bulbs-and-ford-circles-research"
kind = "research"
lifecycle = "active"
default_branch = "main"
layout_status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

[[plane]]
id = "policy"
target = "estate.toml"
authority = "governance"
required = true
current = ["estate.toml", "EXACT_EVIDENCE_BOUNDARY.md"]

[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

# The claim register is the whole proof plane: one root file, no proof/ silo.

[[plane]]
id = "proof"
target = "RESEARCH_bulb-ford-correction.md"
authority = "claim_state"
required = true
current = ["RESEARCH_bulb-ford-correction.md", "RESEARCH_bulb-ford-correction_finite.md"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["reference"]

[[plane]]
id = "experiments"
target = "experiments"
authority = "non_authoritative_experiment"
required = true
current = ["experiments"]

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ARCHITECTURE.md"]

[[language]]
name = "Python"
authority = "canonical"
roles = ["kernel"]
acceptance_authority = true

[migration]
mode = "boundary_first"
mass_move = false
next = []

[governance]
repository = "larsbx/estate-governance"
revision = "bed4af2492dcf17dba2ed03fe429713dc4338da6"

[governance.sha256]
"docs/architecture/estate-repository-template-v1.md" = "30e308be494ac389ff3873cd13b070e22248b44e212c376564d645b6667958ae"
"tools/audit_estate_layout.py" = "c3e17cc08d03b64671f0477635e6c6eee86763ab3301fca936be08b9bd345550"
